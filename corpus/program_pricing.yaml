payment_methods:
  accepted:
    - UPI
    - Net banking
    - Domestic debit and credit cards
    - International credit cards
    - Bank transfer (NEFT/RTGS/SWIFT)
    - EMI via Zenith Capital
    - EMI via Arcline Finance
  not_accepted:
    - Cash
    - Cheque
    - Cryptocurrency
    - Third-party wallets other than UPI

