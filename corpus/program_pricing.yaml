discounts:
  upfront_payment:
    percent: 10
    applies_to: tuition_only
    excludes: [gst, enrolment_deposit]
    stackable_with_emi: false
    stackable_with_scholarships: true
    condition: Full tuition must be received before the Cohort Start Date.

  scholarships:
    - id: MERIT
      name: Merit Scholarship
      max_percent: 30
      basis: MAT score of 85 or above
      applies_to: tuition_only
    - id: WIT
      name: Women in Tech Scholarship
      percent: 15
      basis: Self-declared, verified at enrolment
      applies_to: tuition_only
    - id: RESTART
      name: Career Restart Scholarship
      percent: 20
      basis: Documented career break of 12 months or longer
      applies_to: tuition_only
  scholarship_stacking:
    allowed: true
    max_total_percent: 35
    note: >
      Total stacked scholarship discount is capped at 35% of tuition. A learner
      whose total scholarship discount exceeds 30% of tuition becomes ineligible
      for the Placement Assurance refund product, while retaining full placement
      support services.

